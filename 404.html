<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>찾을 수 없는 쪽이에요</title>
<style>
body{margin:0;background:#F7F5EF;color:#2E2A26;line-height:1.75;display:grid;place-items:center;
     min-height:100vh;font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.box{background:#fff;border-radius:20px;padding:36px 34px;max-width:460px;margin:20px;
     box-shadow:0 2px 14px rgba(0,0,0,.07);text-align:center}
h1{font-size:22px;margin:14px 0 8px}
p{font-size:14.5px;color:#7A6E5E;margin:0 0 18px}
a{display:inline-block;background:#F0C24B;color:#5A410A;text-decoration:none;font-weight:700;
  border-radius:999px;padding:11px 26px;font-size:15px}
svg{width:88px;height:88px}
</style></head><body><div class="box">
<svg viewBox="0 0 64 64"><ellipse cx="32" cy="38" rx="20" ry="21" fill="#C9A87C" stroke="#8A6A48"
 stroke-width="2.5"/><circle cx="24" cy="30" r="8.5" fill="#FFF6E6" stroke="#8A6A48" stroke-width="2.2"/>
<circle cx="40" cy="30" r="8.5" fill="#FFF6E6" stroke="#8A6A48" stroke-width="2.2"/>
<circle cx="24" cy="32" r="3.6" fill="#3E3226"/><circle cx="40" cy="32" r="3.6" fill="#3E3226"/>
<path d="M32 36l-4 5h8z" fill="#E8A33D" stroke="#B87A22" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M14 20l6 8M50 20l-6 8" stroke="#8A6A48" stroke-width="3" stroke-linecap="round"/>
<path d="M22 50q10 -6 20 0" stroke="#8A6A48" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
<h1>이 쪽은 아직 없어요</h1>
<p>주소가 잘못되었거나, 그날 학습지가 아직 올라오지 않았어요.<br>
학습지 목록에서 다시 골라 보세요.</p>
<a href="/">학습지 목록으로 가기</a>
</div></body></html>
